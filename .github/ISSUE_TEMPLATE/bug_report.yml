name: Bug report
description: Report a reproducible problem in Run in Background.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem in Run in Background.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |-
        1. Open...
        2. Choose...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: asset-version
    attributes:
      label: Plugin or theme version
      placeholder: e.g. 1.2.3
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: e.g. 1.13.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: e.g. macOS 26, Windows 11, Android 16, iOS 20
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, logs, or sample files
      description: Remove private information before attaching diagnostics.
